<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0A1412">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hjem">
  <title>Hjem – Energi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/inter-latin-opsz.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <img class="wallpaper" src="img/wallpaper.svg" alt="" aria-hidden="true">
  <!-- Vejr bag fliserne (skyer, sol, stjerner) -->
  <canvas class="wx-back" id="wxBack" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <header class="top">
      <div class="top-side left"><button class="wx-tile" id="wxTile" aria-label="Vejret"></button></div>
      <div class="clock" id="clock" aria-live="off">
        <div class="clock-date" id="clockDate">&nbsp;</div>
        <div class="clock-time" id="clockTime">--:--</div>
      </div>
      <div class="top-side right"></div>
    </header>

    <main class="tiles">
      <section class="tile t-flow" id="tFlow">
        <div class="tile-head">
          <h2>Energi nu</h2>
          <span class="tag" id="flowTag"></span>
        </div>
        <div class="flow" id="flow">
          <svg class="flow-lines" id="flowSvg"></svg>
          <div id="flowNodes"></div>
        </div>
        <div class="flow-msg" id="flowMsg" hidden></div>
      </section>

      <section class="tile t-cam" id="tCam">
        <div class="tile-head">
          <h2>Kameraer</h2>
          <span class="tag" id="camTag"></span>
        </div>
        <div class="cam-grid" id="camGrid"></div>
      </section>

      <section class="tile t-price" id="tPrice">
        <div class="tile-head">
          <h2>Elpris <small id="priceArea"></small></h2>
          <span class="tag" id="priceTag"></span>
        </div>
        <div id="priceBody"></div>
      </section>

      <section class="tile t-today" id="tToday">
        <div class="tile-head">
          <h2>I dag</h2>
          <span class="tag" id="todayTag"></span>
        </div>
        <div id="todayBody"></div>
      </section>

      <section class="tile t-car" id="tCar">
        <div class="tile-head">
          <h2 id="carTitle">ID.3</h2>
          <div class="head-right">
            <span class="tag" id="carTag"></span>
            <button class="round-btn" id="chargerBtn" hidden aria-label="Start/stop lader"></button>
          </div>
        </div>
        <div id="carBody"></div>
      </section>

      <section class="tile t-dev" id="tDev">
        <div class="tile-head">
          <h2>Enheder</h2>
          <span class="tag" id="devTag"></span>
        </div>
        <div class="dev-grid" id="devGrid"></div>
      </section>
    </main>

    <footer class="dock" id="dock"></footer>
  </div>

  <!-- Vejr foran fliserne (regndråber, sne, lyn) -->
  <canvas class="wx-front" id="wxFront" aria-hidden="true"></canvas>

  <div class="modal" id="diagModal" hidden><div class="modal-card diag-card"><h3 id="diagTitle">Rådata</h3><pre id="diagText">Henter …</pre>
    <div class="diag-form" id="diagForm" hidden>
      <div class="yr-lbl">Gem kamera med kode</div>
      <select id="dfCam"></select>
      <input id="dfIp" placeholder="Kameraets IP, fx 192.168.68.131" inputmode="decimal" autocomplete="off">
      <input id="dfPw" type="password" placeholder="Kameraets ONVIF-kode" autocomplete="off">
      <button class="btn primary" id="dfGo">Find og gem</button>
      <div id="dfMsg"></div>
    </div><div class="modal-actions"><button class="btn ghost" id="diagCopy">Kopiér</button><button class="btn primary" id="diagClose">Luk</button></div></div></div>

  <div class="modal" id="camModal" hidden><div class="cam-big"><img id="camBig" alt=""><div class="cam-big-name" id="camBigName"></div><button class="round-btn cam-close" id="camClose" aria-label="Luk">✕</button></div></div>

  <div class="modal" id="wxModal" hidden><div class="modal-card wx-card" id="wxCard"></div></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon"></div>
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="btn ghost" id="modalCancel">Annuller</button>
        <button class="btn primary" id="modalOk">OK</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
